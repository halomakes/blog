# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Build Static Site
permissions:
  contents: write
  actions: write
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 10.x
      - uses: actions/setup-node@v6
        name: Setup Node.JS
        with:
          node-version: 25.x
      - name: Restore Node Packages
        run: npm --prefix ./Halomakes.Blog/theme install
      - name: Build Vite bundles
        run: npm  --prefix ./Halomakes.Blog/theme run build
      - name: Restore NuGet packages
        run: dotnet restore
      - name: Build Solution
        run: dotnet build --no-restore
      - name: Generate Offline Pages
        run: dotnet run --project Halomakes.Blog.OfflineRenderer/Halomakes.Blog.OfflineRenderer.csproj
      - name: Deploy 🚀
        if: github.ref == 'refs/head/master'
        uses: JamesIves/github-pages-deploy-action@v4.8.0
        with:
          folder: Halomakes.Blog.OfflineRenderer/bin/Debug/net10.0/wwwroot
      - name: Trigger Site Crawl
        if: github.ref == 'refs/head/master'
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: Wayback Machine Crawl